name: CI (main)

# `main` est une branche de release délibérée : elle ne reçoit du contenu que
# par un processus de release explicite, jamais par une PR de sprint
# ordinaire pointant directement dessus (voir CONTRIBUTING.md). Aucun code
# applicatif ne vit donc ici en dehors d'une promotion volontaire — ce
# workflow est délibérément minimal, il n'y a rien à lint/tester/builder au
# quotidien.
#
# Il existe uniquement pour que la protection de branche sur `main` ait des
# checks à évaluer. Sans lui, aucune PR vers `main` — y compris une PR de
# correction comme un revert — ne peut jamais obtenir les checks requis, et
# reste bloquée indéfiniment en « Waiting for status ». C'est précisément ce
# qui a empêché de corriger l'incident d'une PR de sprint fusionnée par
# erreur sur `main` (voir CONTRIBUTING.md, section branches).
#
# Volontairement **pas une copie** du `ci.yml` de `develop` : celui-ci
# suppose que `backend/` et `frontend/` existent et sont installables, ce qui
# n'est vrai sur `main` que pendant une release. Un copier-coller aurait
# recassé silencieusement le jour où `main` redevient documentation seule.
#
# ⚠️ IDENTIFIANTS FIGÉS. Les deux noms de job ci-dessous sont les checks
# exigés par la protection de branche sur `main`. Les renommer désactiverait
# silencieusement la vérification : GitHub attendrait indéfiniment un check
# qui ne se produirait plus. Pour les changer, mettre à jour d'abord
# `required_status_checks.contexts` sur `main`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migration, tests)
    runs-on: ubuntu-latest
    steps:
      - run: echo "main est une branche de release sans code applicatif courant — voir CONTRIBUTING.md."

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - run: echo "main est une branche de release sans code applicatif courant — voir CONTRIBUTING.md."
