name: CI (main)

# `main` est une branche de release délibérée : elle ne reçoit du contenu que
# par un processus de release explicite, jamais par une PR de sprint
# ordinaire pointant directement dessus (voir CONTRIBUTING.md). En dehors
# d'une promotion volontaire, `main` ne porte donc aucun `backend/` ni
# `frontend/`.
#
# Ce workflow existe pour que la protection de branche sur `main` ait
# toujours des checks à évaluer — sans lui, aucune PR vers `main` (y compris
# une PR de correction comme un revert) ne peut jamais obtenir les checks
# requis, et reste bloquée indéfiniment en « Waiting for status ». C'est
# précisément ce qui a empêché de corriger l'incident d'une PR de sprint
# fusionnée par erreur sur `main`.
#
# **Auto-désactivant, pas un `echo` inconditionnel.** Chaque job détecte
# d'abord si son répertoire existe : absent, il se contente de le dire et
# réussit trivialement — rien à vérifier hors d'une release. Présent (le cas
# pendant une promotion, ou tant qu'un incident comme celui-ci n'a pas encore
# été nettoyé), il rejoue les **mêmes étapes réelles** que `ci.yml` sur
# `develop` : lint, migration, suite de tests côté backend ; lint, typage,
# tests, build côté frontend. Un `echo` permanent aurait rendu la protection
# de `main` purement cosmétique pour toujours, y compris le jour où une vraie
# release y atterrit — ce que ce fichier évite.
#
# ⚠️ IDENTIFIANTS FIGÉS. Les deux noms de job ci-dessous sont les checks
# exigés par la protection de branche sur `main`. Les renommer désactiverait
# silencieusement la vérification : GitHub attendrait indéfiniment un check
# qui ne se produirait plus. Pour les changer, mettre à jour d'abord
# `required_status_checks.contexts` sur `main`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migration, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delta_user
          POSTGRES_PASSWORD: delta_dev_pwd
          POSTGRES_DB: delta
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U delta_user -d delta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://delta_user:delta_dev_pwd@localhost:5433/delta
      POSTGRES_USER: delta_user
      POSTGRES_PASSWORD: delta_dev_pwd
      POSTGRES_DB: delta
      SECRET_KEY: cle_de_test_ci_sans_valeur_en_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      API_V1_PREFIX: /api/v1
      PROJECT_NAME: Delta
      BACKEND_CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: developpement

    steps:
      - uses: actions/checkout@v4

      - name: Détecter la présence de backend/
        id: detection
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Absence de code — main hors release
        if: steps.detection.outputs.present == 'false'
        run: echo "Aucun backend/ sur main en dehors d'une release — rien à vérifier. Voir CONTRIBUTING.md."

      - uses: actions/setup-python@v5
        if: steps.detection.outputs.present == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: ruff check app tests alembic

      - name: Format (black --check)
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: black --check app tests alembic

      - name: Appliquer la migration sur une base vierge
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: alembic upgrade head

      - name: Vérifier l'absence de dérive modèles / migrations
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: alembic check

      - name: Tests (pytest)
        if: steps.detection.outputs.present == 'true'
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_ENVIRONMENT: developpement

    steps:
      - uses: actions/checkout@v4

      - name: Détecter la présence de frontend/
        id: detection
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Absence de code — main hors release
        if: steps.detection.outputs.present == 'false'
        run: echo "Aucun frontend/ sur main en dehors d'une release — rien à vérifier. Voir CONTRIBUTING.md."

      - uses: actions/setup-node@v4
        if: steps.detection.outputs.present == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Format (prettier --check)
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm run format:check

      - name: Typage (tsc --noEmit)
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Tests (vitest)
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm run test

      - name: Build
        if: steps.detection.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
