[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-backend"
version = "0.1.0"
description = "Backend FastAPI de la plateforme Delta"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    # L'extra `email` tire email-validator, requis par le type EmailStr utilisé
    # sur les schemas d'inscription et de connexion.
    "pydantic[email]>=2.7",
    "python-jose[cryptography]>=3.3",
    # bcrypt en direct plutôt que passlib : passlib 1.7.4 (dernière version,
    # 2020) est incompatible avec bcrypt >= 4.1 — sa sonde de détection de
    # backend hache un mot de passe de plus de 72 octets, ce que bcrypt refuse
    # désormais. Le besoin ici (hacher, vérifier) ne justifie pas une couche
    # d'abstraction supplémentaire.
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
# `alembic/` est un dossier de migrations, pas un package distribuable. Sans
# cette restriction, setuptools voit deux packages racine (`app` et `alembic`),
# refuse de deviner lequel installer et fait echouer `pip install -e .`.
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations générées par Alembic : elles portent des littéraux SQL (expressions
# de CHECK) qu'on ne peut pas couper sans modifier la contrainte elle-même.
# Seul E501 est relâché — le reste du lint s'applique normalement.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rend `backend/` importable, donc `from tests.conftest import ...` resolvable.
# Sans ca, le succes depend de la facon dont l'installation editable expose le
# projet sur sys.path : ca marchait en local et pas en CI.
pythonpath = ["."]
markers = [
    # Tests qui exigent un vrai PostgreSQL : ils portent sur des objets que
    # SQLite ne sait pas reproduire (CHECK en syntaxe PostgreSQL, notamment).
    # Ignores avec un message explicite si la base est injoignable.
    "postgres: necessite un PostgreSQL joignable via DATABASE_URL",
]
