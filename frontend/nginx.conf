# Nginx du conteneur « site » (voir docs/deploiement.md) : sert le site et
# relaie /api au backend. Il n'écoute qu'en http, sur le réseau Docker : le
# HTTPS et le domaine sont tenus par le Nginx du serveur, devant lui.

# Le protocole d'origine vient du Nginx du serveur ; à défaut, celui-ci.
map $http_x_forwarded_proto $proto_origine {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Photos téléversées : 5 Mio côté API, un peu de marge ici.
    client_max_body_size 10M;

    # Les en-têtes de sécurité sont posés par le Nginx du serveur : ici, un
    # add_header dans une location masquerait ceux du bloc server.
    server_tokens off;

    # L'API, relayée telle quelle : pas de « / » après le port, sinon Nginx
    # retirerait /api et les routes /api/v1/... répondraient 404.
    location /api/ {
        proxy_pass http://backend:8000;

        # Le flux de l'assistant IA (SSE) part au fil de l'eau.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origine;
    }

    # Fichiers de construction nommés d'après leur contenu : cache long.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application à page unique : toute adresse inconnue retombe sur
    # index.html, jamais en cache pour qu'une mise à jour se voie aussitôt.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
